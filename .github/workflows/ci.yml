name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install --upgrade pip -r requirements-dev.txt
      - run: ruff check .
      - run: pytest --cov=. --cov-report=term-missing -m "not integration"
      - run: docker build --tag local-ai-assistant:ci .
      - name: Verify container health endpoint
        run: |
          docker run --detach --name local-ai-ci --publish 8501:8501 local-ai-assistant:ci
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8501/_stcore/health && exit 0
            sleep 2
          done
          docker logs local-ai-ci
          exit 1

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "~1.14.0"
      - run: terraform fmt -check -recursive terraform
      - run: terraform -chdir=terraform/bootstrap init -backend=false -input=false
      - run: terraform -chdir=terraform/bootstrap validate
      - run: terraform -chdir=terraform/environments/dev init -backend=false -input=false
      - run: terraform -chdir=terraform/environments/dev validate
      - run: terraform -chdir=terraform/environments/prod init -backend=false -input=false
      - run: terraform -chdir=terraform/environments/prod validate
      - run: terraform -chdir=terraform/modules/platform init -backend=false -input=false
      - run: terraform -chdir=terraform/modules/platform test
      - uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6
      - run: tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: tflint --recursive --config "$(pwd)/.tflint.hcl"

  configuration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip -r requirements-dev.txt
      - run: ansible-playbook -i ansible/inventory.ini.example ansible/playbook.yml --syntax-check
      - run: ansible-lint ansible/playbook.yml
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: shellcheck scripts/*.sh
      - run: ./scripts/check_user_data.sh
      - uses: hashicorp/setup-packer@ce93c3c08a6c2ff2275bf4b54ff0d9a75f6c9789 # v3
      - run: packer init packer
      - run: packer fmt -check -recursive packer
      - run: packer validate -syntax-only packer

  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Validate Markdown, links, and diagram assets
        run: python scripts/check_documentation.py --check-external
      - name: Install pinned Draw.io renderer
        env:
          DRAWIO_DEB_SHA256: f4c49ed84422ea4afd95818f53c54bc666e57b33bd036d468c7096619b47ffd9
          DRAWIO_VERSION: 31.1.8
        run: |
          package="drawio-amd64-${DRAWIO_VERSION}.deb"
          curl --fail --location --silent --show-error \
            --output "/tmp/${package}" \
            "https://github.com/jgraph/drawio-desktop/releases/download/v${DRAWIO_VERSION}/${package}"
          echo "${DRAWIO_DEB_SHA256}  /tmp/${package}" | sha256sum --check --strict
          sudo apt-get update
          sudo apt-get install --yes "/tmp/${package}" xvfb
      - name: Verify reproducible architecture renders
        env:
          DRAWIO_BIN: drawio
          DRAWIO_USE_XVFB: "1"
        run: bash scripts/render_architecture_diagrams.sh --check

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: bridgecrewio/checkov-action@9b70310bcd306d11740313070b940167d6b23085 # v12
        with:
          config_file: .checkov.yml
          directory: terraform
          framework: terraform
          quiet: true
          soft_fail: false
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          # Checkov is the policy gate for Terraform; Trivy covers dependencies and secrets.
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: "1"
