name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip -r requirements-dev.txt

      - name: Compile Python
        run: python -m compileall -q app.py config.py ollama_client.py examples tests

      - name: Lint Python
        run: ruff check .

      - name: Run tests
        run: pytest -v

      - name: Validate Ansible
        working-directory: ansible
        run: ansible-playbook -i inventory.ini.example playbook.yml --syntax-check

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Check shell scripts
        run: |
          shellcheck server_script.sh docker_setup.sh deploy_with_ansible.sh terraform/wait_for_application.sh ansible/roles/local_ai_assistant/files/local-ai-assistant-health
          shellcheck -e SC2086,SC2154 terraform/app_user_data.sh.tftpl terraform/ollama_user_data.sh.tftpl

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.14.0"

      - name: Check Terraform formatting
        run: terraform -chdir=terraform fmt -check -recursive

      - name: Initialize Terraform
        run: terraform -chdir=terraform init -backend=false -input=false

      - name: Validate Terraform
        run: terraform -chdir=terraform validate

      - name: Build Docker image
        run: docker build -t local-ai-assistant:ci .
