name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install --upgrade pip -r requirements-dev.txt
      - run: python -m compileall -q app.py config.py ollama_client.py examples tests
      - run: ruff check .
      - run: pytest -v
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: shellcheck terraform/wait_for_application.sh
      - run: shellcheck -e SC2086,SC2154 terraform/user_data.sh.tftpl
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.14.0"
      - run: terraform -chdir=terraform fmt -check -recursive
      - run: terraform -chdir=terraform init -backend=false -input=false
      - run: terraform -chdir=terraform validate
