name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install --upgrade pip -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -v
      - working-directory: ansible
        run: ansible-playbook -i inventory.ini.example playbook.yml --syntax-check
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: shellcheck deploy_with_ansible.sh ansible/roles/local_ai_assistant/files/local-ai-assistant-health
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.14.0"
      - run: terraform -chdir=terraform fmt -check -recursive
      - run: terraform -chdir=terraform init -backend=false -input=false
      - run: terraform -chdir=terraform validate
      - run: docker build -t local-ai-assistant:ci .
