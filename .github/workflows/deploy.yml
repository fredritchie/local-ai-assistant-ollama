name: Controlled deployment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to operate on
        required: true
        type: choice
        options: [dev, prod]
      operation:
        description: Plan, deploy, or destroy the selected environment
        required: true
        type: choice
        options: [plan, deploy, destroy]
        default: plan
      confirm_destroy:
        description: Type DESTROY to permit a destroy operation
        required: false
        type: string
      image_uri:
        description: Existing ECR digest to promote; leave empty to build this commit
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    outputs:
      plan_artifact_name: ${{ steps.plan_metadata.outputs.artifact_name }}
      image_uri: ${{ steps.deployment_image.outputs.uri }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Load non-secret environment configuration
        id: config
        run: |
          config_file=".github/deployment-config/${{ inputs.environment }}.env"
          if [[ ! -f "$config_file" ]]; then
            echo "Missing $config_file; copy and configure its .example file" >&2
            exit 2
          fi
          while IFS= read -r line || [[ -n "$line" ]]; do
            [[ -z "$line" || "$line" == \#* ]] && continue
            if [[ ! "$line" =~ ^[A-Z][A-Z0-9_]*= ]]; then
              echo "Invalid configuration line in $config_file" >&2
              exit 2
            fi
            echo "$line" >>"$GITHUB_ENV"
            echo "$line" >>"$GITHUB_OUTPUT"
          done <"$config_file"
      - name: Export optional domain settings
        run: |
          if [[ -n "$ACM_CERTIFICATE_ARN" ]]; then
            echo "TF_VAR_certificate_arn=$ACM_CERTIFICATE_ARN" >>"$GITHUB_ENV"
          fi
          if [[ -n "$ALARM_EMAIL" ]]; then
            echo "TF_VAR_alarm_email=$ALARM_EMAIL" >>"$GITHUB_ENV"
          fi
          if [[ -n "$ENABLE_DUCKDNS" ]]; then
            [[ "$ENABLE_DUCKDNS" =~ ^(true|false)$ ]]
            echo "TF_VAR_enable_duckdns=$ENABLE_DUCKDNS" >>"$GITHUB_ENV"
          fi
          if [[ -n "$ENABLE_LETSENCRYPT" ]]; then
            [[ "$ENABLE_LETSENCRYPT" =~ ^(true|false)$ ]]
            echo "LETSENCRYPT_ENABLED=$ENABLE_LETSENCRYPT" >>"$GITHUB_ENV"
          fi
          if [[ -n "$DUCKDNS_SUBDOMAIN" ]]; then
            echo "TF_VAR_duckdns_subdomain=$DUCKDNS_SUBDOMAIN" >>"$GITHUB_ENV"
          fi
          if [[ -n "$LETSENCRYPT_EMAIL" ]]; then
            echo "LETSENCRYPT_EMAIL=$LETSENCRYPT_EMAIL" >>"$GITHUB_ENV"
          fi
          if [[ "$ENABLE_LETSENCRYPT" == "true" ]]; then
            if [[ "$ENABLE_DUCKDNS" != "true" || -z "$DUCKDNS_SUBDOMAIN" || -z "$LETSENCRYPT_EMAIL" ]]; then
              echo "Let's Encrypt requires ENABLE_DUCKDNS=true, DUCKDNS_SUBDOMAIN, and LETSENCRYPT_EMAIL" >&2
              exit 2
            fi
          fi
      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          role-to-assume: ${{ steps.config.outputs.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-south-1
      - name: Resolve managed Let's Encrypt certificate
        if: inputs.environment == 'prod' && env.LETSENCRYPT_ENABLED == 'true'
        run: |
          certificate_arn=$(aws ssm get-parameter \
            --name /local-ai-assistant/prod/letsencrypt/acm_certificate_arn \
            --query Parameter.Value --output text 2>/dev/null || true)
          if [[ -n "$certificate_arn" && "$certificate_arn" != "None" ]]; then
            echo "TF_VAR_certificate_arn=$certificate_arn" >>"$GITHUB_ENV"
            echo "TF_VAR_enable_https=true" >>"$GITHUB_ENV"
            echo "LETSENCRYPT_CERTIFICATE_ARN=$certificate_arn" >>"$GITHUB_ENV"
          else
            # The first deploy creates the certificate after an HTTP bootstrap.
            echo "TF_VAR_enable_https=false" >>"$GITHUB_ENV"
          fi
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "~1.14.0"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Require explicit destroy confirmation
        if: inputs.operation == 'destroy' && inputs.confirm_destroy != 'DESTROY'
        run: |
          echo "Destroy operations require confirm_destroy=DESTROY" >&2
          exit 1
      - name: Build and publish immutable image
        if: inputs.operation != 'destroy' && inputs.image_uri == ''
        id: image
        run: |
          image_uri=$(./scripts/build_and_push.sh "$ECR_REPOSITORY_URL")
          echo "uri=$image_uri" >>"$GITHUB_OUTPUT"
      - name: Resolve deployment image
        id: deployment_image
        env:
          PROVIDED_IMAGE_URI: ${{ inputs.image_uri }}
          BUILT_IMAGE_URI: ${{ steps.image.outputs.uri }}
        run: |
          image_uri=${PROVIDED_IMAGE_URI:-$BUILT_IMAGE_URI}
          if [[ ! "$image_uri" =~ ^[0-9]+\.dkr\.ecr\.[a-z0-9-]+\.amazonaws\.com/.+@sha256:[0-9a-f]{64}$ ]]; then
            echo "A digest-pinned ECR image URI is required" >&2
            exit 1
          fi
          echo "uri=$image_uri" >>"$GITHUB_OUTPUT"
      - name: Initialize remote state
        working-directory: terraform/environments/${{ inputs.environment }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="kms_key_id=$TF_STATE_KMS_KEY_ID"
      - name: Prepare production for destruction
        if: inputs.operation == 'destroy' && inputs.environment == 'prod'
        working-directory: terraform/environments/prod
        run: |
          state_json=$(terraform show -json)
          tracked_resources=$(jq -r '[
            .values.root_module.resources[]?,
            .values.root_module.child_modules[]?.resources[]?
          ] | length' <<<"$state_json")

          if [[ "$tracked_resources" -eq 0 ]]; then
            echo "Production Terraform state is empty; refusing to create resources during teardown." >&2
            echo "Restore the correct state version before retrying destroy." >&2
            exit 2
          fi

          resource_value() {
            local address=$1
            local attribute=$2
            jq -r --arg address "$address" --arg attribute "$attribute" '[
              .values.root_module.resources[]?,
              .values.root_module.child_modules[]?.resources[]?
            ] | map(select(.address == $address))[0].values[$attribute] // empty' <<<"$state_json"
          }

          database_id=$(resource_value module.platform.aws_db_instance.chat identifier)
          if [[ -n "$database_id" ]]; then
            aws rds modify-db-instance \
              --db-instance-identifier "$database_id" \
              --no-deletion-protection \
              --apply-immediately >/dev/null
            aws rds wait db-instance-available \
              --db-instance-identifier "$database_id"
          fi

          for load_balancer_address in \
            module.platform.aws_lb.public \
            module.platform.aws_lb.ollama; do
            load_balancer_arn=$(resource_value "$load_balancer_address" arn)
            if [[ -n "$load_balancer_arn" ]]; then
              aws elbv2 modify-load-balancer-attributes \
                --load-balancer-arn "$load_balancer_arn" \
                --attributes Key=deletion_protection.enabled,Value=false >/dev/null
            fi
          done
      - name: Create infrastructure plan
        working-directory: terraform/environments/${{ inputs.environment }}
        run: |
          operation='${{ inputs.operation }}'
          plan_args=(
            -input=false
            -out=tfplan
            -var="app_image_uri=${{ steps.deployment_image.outputs.uri }}"
          )
          if [[ "$operation" == "destroy" ]]; then
            plan_args+=( -destroy )
            if [[ "${{ inputs.environment }}" == "prod" ]]; then
              plan_args+=(
                -var="enable_https=false"
                -var="enable_deletion_protection=false"
                -var="force_destroy_log_bucket=true"
              )
            fi
          fi
          terraform plan "${plan_args[@]}"
      - name: Render plan for review
        working-directory: terraform/environments/${{ inputs.environment }}
        run: |
          terraform show -no-color tfplan > tfplan.txt
          echo "Terraform plan is available in the workflow artifact as tfplan.txt."
      - name: Name plan artifact
        id: plan_metadata
        run: |
          echo "artifact_name=terraform-${{ inputs.operation }}-plan-${{ inputs.environment }}-${{ github.sha }}" >>"$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ steps.plan_metadata.outputs.artifact_name }}
          path: |
            terraform/environments/${{ inputs.environment }}/tfplan
            terraform/environments/${{ inputs.environment }}/tfplan.txt
          retention-days: 7

  apply:
    needs: plan
    if: ${{ inputs.operation != 'plan' }}
    runs-on: ubuntu-latest
    # A protected environment approval on this job happens after the plan job
    # has published its readable tfplan.txt artifact.
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Load non-secret environment configuration
        id: config
        run: |
          config_file=".github/deployment-config/${{ inputs.environment }}.env"
          if [[ ! -f "$config_file" ]]; then
            echo "Missing $config_file; copy and configure its .example file" >&2
            exit 2
          fi
          while IFS= read -r line || [[ -n "$line" ]]; do
            [[ -z "$line" || "$line" == \#* ]] && continue
            if [[ ! "$line" =~ ^[A-Z][A-Z0-9_]*= ]]; then
              echo "Invalid configuration line in $config_file" >&2
              exit 2
            fi
            echo "$line" >>"$GITHUB_ENV"
            echo "$line" >>"$GITHUB_OUTPUT"
          done <"$config_file"
      - name: Export optional domain settings
        run: |
          if [[ -n "$ACM_CERTIFICATE_ARN" ]]; then
            echo "TF_VAR_certificate_arn=$ACM_CERTIFICATE_ARN" >>"$GITHUB_ENV"
          fi
          if [[ -n "$ALARM_EMAIL" ]]; then
            echo "TF_VAR_alarm_email=$ALARM_EMAIL" >>"$GITHUB_ENV"
          fi
          if [[ -n "$ENABLE_DUCKDNS" ]]; then
            [[ "$ENABLE_DUCKDNS" =~ ^(true|false)$ ]]
            echo "TF_VAR_enable_duckdns=$ENABLE_DUCKDNS" >>"$GITHUB_ENV"
          fi
          if [[ -n "$ENABLE_LETSENCRYPT" ]]; then
            [[ "$ENABLE_LETSENCRYPT" =~ ^(true|false)$ ]]
            echo "LETSENCRYPT_ENABLED=$ENABLE_LETSENCRYPT" >>"$GITHUB_ENV"
          fi
          if [[ -n "$DUCKDNS_SUBDOMAIN" ]]; then
            echo "TF_VAR_duckdns_subdomain=$DUCKDNS_SUBDOMAIN" >>"$GITHUB_ENV"
          fi
          if [[ -n "$LETSENCRYPT_EMAIL" ]]; then
            echo "LETSENCRYPT_EMAIL=$LETSENCRYPT_EMAIL" >>"$GITHUB_ENV"
          fi
          if [[ "$ENABLE_LETSENCRYPT" == "true" ]]; then
            if [[ "$ENABLE_DUCKDNS" != "true" || -z "$DUCKDNS_SUBDOMAIN" || -z "$LETSENCRYPT_EMAIL" ]]; then
              echo "Let's Encrypt requires ENABLE_DUCKDNS=true, DUCKDNS_SUBDOMAIN, and LETSENCRYPT_EMAIL" >&2
              exit 2
            fi
          fi
      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          role-to-assume: ${{ steps.config.outputs.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-south-1
      - name: Resolve managed Let's Encrypt certificate
        if: inputs.environment == 'prod' && env.LETSENCRYPT_ENABLED == 'true'
        run: |
          certificate_arn=$(aws ssm get-parameter \
            --name /local-ai-assistant/prod/letsencrypt/acm_certificate_arn \
            --query Parameter.Value --output text 2>/dev/null || true)
          if [[ -n "$certificate_arn" && "$certificate_arn" != "None" ]]; then
            echo "TF_VAR_certificate_arn=$certificate_arn" >>"$GITHUB_ENV"
            echo "TF_VAR_enable_https=true" >>"$GITHUB_ENV"
            echo "LETSENCRYPT_CERTIFICATE_ARN=$certificate_arn" >>"$GITHUB_ENV"
          else
            # The reviewed bootstrap plan is HTTP-only; HTTPS is reconciled after issuance.
            echo "TF_VAR_enable_https=false" >>"$GITHUB_ENV"
          fi
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "~1.14.0"
      - name: Initialize remote state
        working-directory: terraform/environments/${{ inputs.environment }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="kms_key_id=$TF_STATE_KMS_KEY_ID"
      - name: Download reviewed plan
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.plan.outputs.plan_artifact_name }}
          path: terraform/environments/${{ inputs.environment }}
      - name: Execute approved saved plan
        working-directory: terraform/environments/${{ inputs.environment }}
        run: terraform apply -input=false tfplan
      - name: Issue first Let's Encrypt certificate and enable HTTPS
        if: inputs.operation == 'deploy' && inputs.environment == 'prod' && env.LETSENCRYPT_ENABLED == 'true' && env.LETSENCRYPT_CERTIFICATE_ARN == ''
        env:
          DUCKDNS_TOKEN: ${{ secrets.DUCKDNS_TOKEN }}
        working-directory: terraform/environments/prod
        run: |
          if [[ -z "$DUCKDNS_TOKEN" || -z "$DUCKDNS_SUBDOMAIN" || -z "$LETSENCRYPT_EMAIL" ]]; then
            echo "DUCKDNS_TOKEN, DUCKDNS_SUBDOMAIN, and LETSENCRYPT_EMAIL are required" >&2
            exit 2
          fi
          echo "::add-mask::$DUCKDNS_TOKEN"

          duckdns_ip=$(terraform output -raw duckdns_ipv4)
          if aws secretsmanager describe-secret \
            --secret-id local-ai-assistant/duckdns-token >/dev/null 2>&1; then
            aws secretsmanager put-secret-value \
              --secret-id local-ai-assistant/duckdns-token \
              --secret-string "$DUCKDNS_TOKEN" >/dev/null
          else
            aws secretsmanager create-secret \
              --name local-ai-assistant/duckdns-token \
              --secret-string "$DUCKDNS_TOKEN" >/dev/null
          fi

          ../../../scripts/update_duckdns.sh "$DUCKDNS_SUBDOMAIN" "$duckdns_ip"
          sudo apt-get update
          sudo apt-get install --yes certbot
          certificate_arn=$(DUCKDNS_TOKEN="$DUCKDNS_TOKEN" \
            ../../../scripts/issue_letsencrypt_duckdns.sh \
              "$LETSENCRYPT_EMAIL" "$DUCKDNS_SUBDOMAIN")

          aws ssm put-parameter --overwrite --type String \
            --name /local-ai-assistant/prod/letsencrypt/acm_certificate_arn \
            --value "$certificate_arn" >/dev/null
          aws ssm put-parameter --overwrite --type String \
            --name /local-ai-assistant/prod/letsencrypt/duckdns_ipv4 \
            --value "$duckdns_ip" >/dev/null
          export TF_VAR_certificate_arn="$certificate_arn"
          export TF_VAR_enable_https=true
          export TF_VAR_app_image_uri="${{ needs.plan.outputs.image_uri }}"

          terraform plan -input=false -out=https.tfplan
          terraform apply -input=false https.tfplan
      - name: Bootstrap PostgreSQL IAM user
        if: inputs.operation == 'deploy'
        working-directory: terraform/environments/${{ inputs.environment }}
        run: |
          project_name=$(terraform output -raw database_bootstrap_project_name)
          build_id=$(aws codebuild start-build --project-name "$project_name" \
            --query 'build.id' --output text)
          echo "Started database bootstrap build: $build_id"

          for _ in $(seq 1 90); do
            status=$(aws codebuild batch-get-builds --ids "$build_id" \
              --query 'builds[0].buildStatus' --output text)
            case "$status" in
              SUCCEEDED)
                echo "PostgreSQL IAM user bootstrap completed."
                exit 0
                ;;
              FAILED|FAULT|STOPPED|TIMED_OUT)
                echo "PostgreSQL IAM user bootstrap failed: $status" >&2
                exit 1
                ;;
            esac
            sleep 10
          done

          echo "Timed out waiting for database bootstrap build: $build_id" >&2
          exit 1
      - name: Wait for application health
        if: inputs.operation == 'deploy'
        working-directory: terraform/environments/${{ inputs.environment }}
        run: |
          health_url=$(terraform output -raw application_health_url)
          ../../../scripts/wait_for_application.sh "$health_url"
