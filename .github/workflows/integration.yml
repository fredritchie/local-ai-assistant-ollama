name: Deployed integration tests

on:
  workflow_dispatch:
    inputs:
      application_url:
        description: Deployed ALB URL to test
        required: true
        type: string

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip -r requirements-dev.txt
      - env:
          INTEGRATION_BASE_URL: ${{ inputs.application_url }}
        run: |
          ./scripts/smoke_test.sh "$INTEGRATION_BASE_URL"
          pytest -v -m integration
