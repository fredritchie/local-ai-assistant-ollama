name: Renew DuckDNS Let's Encrypt certificate

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 1 * *"

permissions:
  contents: read
  id-token: write

concurrency:
  group: renew-production-certificate
  cancel-in-progress: false

jobs:
  renew:
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Load non-secret production configuration
        id: config
        run: |
          config_file=.github/deployment-config/prod.env
          if [[ ! -f "$config_file" ]]; then
            echo "Missing $config_file; copy and configure its .example file" >&2
            exit 2
          fi
          while IFS= read -r line || [[ -n "$line" ]]; do
            [[ -z "$line" || "$line" == \#* ]] && continue
            if [[ ! "$line" =~ ^[A-Z][A-Z0-9_]*= ]]; then
              echo "Invalid configuration line in $config_file" >&2
              exit 2
            fi
            echo "$line" >>"$GITHUB_ENV"
            echo "$line" >>"$GITHUB_OUTPUT"
          done <"$config_file"
      - name: Validate renewal configuration
        run: |
          for variable in AWS_DEPLOY_ROLE_ARN DUCKDNS_SUBDOMAIN LETSENCRYPT_EMAIL; do
            if [[ -z "${!variable:-}" ]]; then
              echo "GitHub environment variable $variable is required" >&2
              exit 2
            fi
          done
      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          role-to-assume: ${{ steps.config.outputs.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-south-1
      - name: Resolve managed certificate configuration
        run: |
          duckdns_ip=$(aws ssm get-parameter \
            --name /local-ai-assistant/prod/letsencrypt/duckdns_ipv4 \
            --query Parameter.Value --output text)
          certificate_arn=$(aws ssm get-parameter \
            --name /local-ai-assistant/prod/letsencrypt/acm_certificate_arn \
            --query Parameter.Value --output text)
          echo "DUCKDNS_IPV4=$duckdns_ip" >>"$GITHUB_ENV"
          echo "ACM_CERTIFICATE_ARN=$certificate_arn" >>"$GITHUB_ENV"
      - name: Install Certbot
        run: |
          sudo apt-get update
          sudo apt-get install --yes certbot
      - name: Renew and reimport certificate
        env:
          AWS_REGION: ap-south-1
        run: |
          DUCKDNS_TOKEN=$(aws secretsmanager get-secret-value \
            --secret-id local-ai-assistant/duckdns-token \
            --query SecretString --output text)
          echo "::add-mask::$DUCKDNS_TOKEN"
          export DUCKDNS_TOKEN

          ./scripts/update_duckdns.sh "$DUCKDNS_SUBDOMAIN" "$DUCKDNS_IPV4"
          ./scripts/issue_letsencrypt_duckdns.sh \
            "$LETSENCRYPT_EMAIL" \
            "$DUCKDNS_SUBDOMAIN" \
            "$ACM_CERTIFICATE_ARN"
