---
- name: Configure private Ollama inference service
  hosts: ollama_servers
  become: true
  gather_facts: true
  vars:
    service_role: ollama
  roles:
    - local_ai_assistant

- name: Configure public Streamlit web service
  hosts: streamlit_servers
  become: true
  gather_facts: true
  vars:
    service_role: streamlit
  roles:
    - local_ai_assistant
