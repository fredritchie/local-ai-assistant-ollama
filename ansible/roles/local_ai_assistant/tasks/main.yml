---
- name: Validate common deployment variables
  ansible.builtin.assert:
    that:
      - ansible_facts.os_family == "Debian"
      - service_role in ["streamlit", "ollama"]
      - ollama_primary_model is match("^[A-Za-z0-9._/-]+(:[A-Za-z0-9._-]+)?$")
    quiet: true

- name: Install common packages
  ansible.builtin.apt:
    name: [ca-certificates, curl]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Read installed Ollama version
  ansible.builtin.command: ollama --version
  register: ollama_version_result
  changed_when: false
  failed_when: false
  when: service_role == "ollama"

- name: Download Ollama installer
  ansible.builtin.get_url:
    url: https://ollama.com/install.sh
    dest: /tmp/ollama-install.sh
    mode: "0755"
  when:
    - service_role == "ollama"
    - ollama_version_result.rc != 0 or ollama_version not in ollama_version_result.stdout

- name: Install configured Ollama version
  ansible.builtin.command: /tmp/ollama-install.sh
  environment:
    OLLAMA_VERSION: "{{ ollama_version }}"
  when:
    - service_role == "ollama"
    - ollama_version_result.rc != 0 or ollama_version not in ollama_version_result.stdout

- name: Create Ollama systemd override directory
  ansible.builtin.file:
    path: /etc/systemd/system/ollama.service.d
    state: directory
    mode: "0755"
  when: service_role == "ollama"

- name: Bind Ollama to the private network interface
  ansible.builtin.copy:
    dest: /etc/systemd/system/ollama.service.d/network.conf
    mode: "0644"
    content: |
      [Service]
      Environment="OLLAMA_HOST=0.0.0.0:11434"
  notify: Restart Ollama
  when: service_role == "ollama"

- name: Apply Ollama service changes
  ansible.builtin.meta: flush_handlers

- name: Enable Ollama
  ansible.builtin.systemd_service:
    name: ollama
    enabled: true
    state: started
  when: service_role == "ollama"

- name: Wait for local Ollama API
  ansible.builtin.uri:
    url: http://127.0.0.1:11434/api/tags
    status_code: 200
  register: ollama_api
  retries: 30
  delay: 2
  until: ollama_api.status == 200
  when: service_role == "ollama"

- name: List installed models
  ansible.builtin.command: ollama list
  register: ollama_model_list
  changed_when: false
  when: service_role == "ollama"

- name: Record installed model names
  ansible.builtin.set_fact:
    ollama_installed_models: "{{ ollama_model_list.stdout_lines[1:] | map('regex_replace', '\\s+.*$', '') | list }}"
  when: service_role == "ollama"

- name: Pull primary model
  ansible.builtin.command: "ollama pull {{ ollama_primary_model }}"
  register: primary_model_pull
  retries: 3
  delay: 10
  until: primary_model_pull.rc == 0
  when:
    - service_role == "ollama"
    - ollama_primary_model not in ollama_installed_models

- name: Pull additional models
  ansible.builtin.command: "ollama pull {{ item }}"
  loop: "{{ ollama_additional_models }}"
  register: additional_model_pull
  retries: 3
  delay: 10
  until: additional_model_pull.rc == 0
  when:
    - service_role == "ollama"
    - item not in ollama_installed_models

- name: Install Streamlit host packages
  ansible.builtin.apt:
    name: [git, python3, python3-pip, python3-venv]
    state: present
  when: service_role == "streamlit"

- name: Wait for private Ollama API
  ansible.builtin.uri:
    url: "{{ ollama_private_url }}/api/tags"
    status_code: 200
  register: private_ollama_api
  retries: 180
  delay: 10
  until: private_ollama_api.status == 200
  when: service_role == "streamlit"

- name: Create application account
  ansible.builtin.user:
    name: "{{ app_user }}"
    home: "{{ app_install_dir }}"
    create_home: false
    shell: /usr/sbin/nologin
    system: true
  when: service_role == "streamlit"

- name: Create application directory
  ansible.builtin.file:
    path: "{{ app_install_dir }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0755"
  when: service_role == "streamlit"

- name: Check out application repository
  become_user: "{{ app_user }}"
  ansible.builtin.git:
    repo: "{{ app_repository_url }}"
    dest: "{{ app_install_dir }}"
    version: "{{ app_repository_version | default(app_repository_branch, true) }}"
    update: true
  register: app_repository_checkout
  notify: Restart Local AI Assistant
  when: service_role == "streamlit"

- name: Create native virtual environment
  become_user: "{{ app_user }}"
  ansible.builtin.command: "python3 -m venv {{ app_install_dir }}/.venv"
  args:
    creates: "{{ app_install_dir }}/.venv/bin/python"
  when:
    - service_role == "streamlit"

- name: Install native Python dependencies
  become_user: "{{ app_user }}"
  ansible.builtin.pip:
    requirements: "{{ app_install_dir }}/requirements.txt"
    virtualenv: "{{ app_install_dir }}/.venv"
  notify: Restart Local AI Assistant
  when:
    - service_role == "streamlit"

- name: Install Streamlit systemd unit
  ansible.builtin.template:
    src: local-ai-assistant.service.j2
    dest: /etc/systemd/system/local-ai-assistant.service
    mode: "0644"
  notify:
    - Reload systemd
    - Restart Local AI Assistant
  when: service_role == "streamlit"

- name: Install Streamlit health command
  ansible.builtin.copy:
    src: local-ai-assistant-health
    dest: /usr/local/bin/local-ai-assistant-health
    mode: "0755"
  when: service_role == "streamlit"

- name: Apply Streamlit service changes
  ansible.builtin.meta: flush_handlers

- name: Verify Streamlit health
  ansible.builtin.command: /usr/local/bin/local-ai-assistant-health
  changed_when: false
  register: streamlit_health
  retries: 30
  delay: 5
  until: streamlit_health.rc == 0
  when: service_role == "streamlit"
