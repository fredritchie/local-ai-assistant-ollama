---
- name: Validate immutable image variables
  ansible.builtin.assert:
    that:
      - ansible_facts.os_family == "Debian"
      - ansible_facts.architecture in ["aarch64", "arm64", "x86_64", "amd64"]
      - local_ai_assistant_service_role in ["streamlit", "ollama"]
      - local_ai_assistant_ollama_version is match("^[0-9]+\\.[0-9]+\\.[0-9]+$")
    quiet: true

- name: Install common image packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - jq
      - unzip
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Select AWS CLI architecture
  ansible.builtin.set_fact:
    local_ai_assistant_aws_cli_arch: >-
      {{ 'aarch64' if ansible_facts.architecture in ['aarch64', 'arm64'] else 'x86_64' }}

- name: Check for AWS CLI v2
  ansible.builtin.stat:
    path: /usr/local/bin/aws
  register: local_ai_assistant_aws_cli

- name: Download AWS CLI v2
  ansible.builtin.get_url:
    url: >-
      https://awscli.amazonaws.com/awscli-exe-linux-{{ local_ai_assistant_aws_cli_arch }}.zip
    dest: /tmp/awscliv2.zip
    mode: "0644"
  when: not local_ai_assistant_aws_cli.stat.exists

- name: Extract AWS CLI v2
  ansible.builtin.unarchive:
    src: /tmp/awscliv2.zip
    dest: /tmp
    remote_src: true
    creates: /tmp/aws/install
  when: not local_ai_assistant_aws_cli.stat.exists

- name: Install AWS CLI v2
  ansible.builtin.command: /tmp/aws/install
  args:
    creates: /usr/local/bin/aws

- name: Install application image packages
  ansible.builtin.apt:
    name:
      - docker.io
      - nginx
    state: present
  when: local_ai_assistant_service_role == "streamlit"

- name: Enable application image services
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
  loop:
    - docker
    - nginx
  when: local_ai_assistant_service_role == "streamlit"

- name: Install XFS tools for the model cache
  ansible.builtin.apt:
    name: xfsprogs
    state: present
  when: local_ai_assistant_service_role == "ollama"

- name: Read installed Ollama version
  ansible.builtin.command: ollama --version
  register: local_ai_assistant_ollama_version_result
  changed_when: false
  failed_when: false
  when: local_ai_assistant_service_role == "ollama"

- name: Download Ollama installer
  ansible.builtin.get_url:
    url: https://ollama.com/install.sh
    dest: /tmp/ollama-install.sh
    mode: "0755"
  when:
    - local_ai_assistant_service_role == "ollama"
    - >-
      local_ai_assistant_ollama_version_result.rc != 0 or
      local_ai_assistant_ollama_version not in
      local_ai_assistant_ollama_version_result.stdout

- name: Install pinned Ollama version
  ansible.builtin.command: /tmp/ollama-install.sh
  environment:
    HOME: /root
    OLLAMA_VERSION: "{{ local_ai_assistant_ollama_version }}"
  changed_when: true
  when:
    - local_ai_assistant_service_role == "ollama"
    - >-
      local_ai_assistant_ollama_version_result.rc != 0 or
      local_ai_assistant_ollama_version not in
      local_ai_assistant_ollama_version_result.stdout

- name: Stop Ollama before creating the reusable image
  ansible.builtin.systemd_service:
    name: ollama
    enabled: true
    state: stopped
  when: local_ai_assistant_service_role == "ollama"

- name: Remove transient package data
  ansible.builtin.apt:
    autoclean: true
    autoremove: true

- name: Clear cloud-init state for the next launch
  ansible.builtin.command: cloud-init clean --logs
  changed_when: true
