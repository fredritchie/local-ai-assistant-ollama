<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Local AI Assistant architecture evolution</title><desc id="desc">Nine branches evolve from native local execution through Docker, single-node AWS automation, Ansible, two-tier microservices, and a production high-availability AWS platform.</desc>
  <defs><style>.bg{fill:#0d1117}.lane{fill:#161b22;stroke:#30363d;stroke-width:2}.local{fill:#173425;stroke:#3fb950;stroke-width:2}.aws{fill:#17253a;stroke:#58a6ff;stroke-width:2}.ansible{fill:#38251a;stroke:#d29922;stroke-width:2}.prod{fill:#2b1d3d;stroke:#bc8cff;stroke-width:3}.text{fill:#f0f6fc;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.muted{fill:#8b949e;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.title{font-size:28px;font-weight:700}.label{font-size:16px;font-weight:650}.small{font-size:12px}.flow{fill:none;stroke:#f0f6fc;stroke-width:3;marker-end:url(#a)}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#f0f6fc"/></marker></defs>
  <rect class="bg" width="1400" height="760"/><text class="text title" x="40" y="48">Architecture Evolution — One Application, Nine Deployment Stages</text>
  <rect class="lane" x="40" y="85" width="1320" height="145" rx="16"/><text class="text label" x="70" y="120">LOCAL</text>
  <rect class="local" x="200" y="115" width="260" height="82" rx="12"/><text class="text label" x="330" y="146" text-anchor="middle">Local native</text><text class="muted small" x="330" y="173" text-anchor="middle">Python + Streamlit + Ollama</text>
  <rect class="local" x="610" y="115" width="300" height="82" rx="12"/><text class="text label" x="760" y="146" text-anchor="middle">Local Docker</text><text class="muted small" x="760" y="173" text-anchor="middle">Container app + host Ollama</text><path class="flow" d="M460 156 H600"/>
  <rect class="lane" x="40" y="255" width="1320" height="145" rx="16"/><text class="text label" x="70" y="290">SINGLE-NODE AWS</text>
  <rect class="aws" x="190" y="290" width="230" height="82" rx="12"/><text class="text label" x="305" y="321" text-anchor="middle">User data native</text><text class="muted small" x="305" y="348" text-anchor="middle">Terraform + cloud-init</text>
  <rect class="aws" x="480" y="290" width="230" height="82" rx="12"/><text class="text label" x="595" y="321" text-anchor="middle">User data Docker</text><text class="muted small" x="595" y="348" text-anchor="middle">cloud-init + container</text>
  <rect class="ansible" x="770" y="290" width="230" height="82" rx="12"/><text class="text label" x="885" y="321" text-anchor="middle">Ansible native</text><text class="muted small" x="885" y="348" text-anchor="middle">idempotent services</text>
  <rect class="ansible" x="1060" y="290" width="230" height="82" rx="12"/><text class="text label" x="1175" y="321" text-anchor="middle">Ansible Docker</text><text class="muted small" x="1175" y="348" text-anchor="middle">config + container</text>
  <path class="flow" d="M420 331 H470"/><path class="flow" d="M710 331 H760"/><path class="flow" d="M1000 331 H1050"/>
  <rect class="lane" x="40" y="425" width="1320" height="145" rx="16"/><text class="text label" x="70" y="460">TWO-TIER AWS</text>
  <rect class="ansible" x="260" y="460" width="330" height="82" rx="12"/><text class="text label" x="425" y="491" text-anchor="middle">Microservices native</text><text class="muted small" x="425" y="518" text-anchor="middle">public app + private GPU</text>
  <rect class="ansible" x="760" y="460" width="360" height="82" rx="12"/><text class="text label" x="940" y="491" text-anchor="middle">Microservices Docker</text><text class="muted small" x="940" y="518" text-anchor="middle">container app + private native Ollama</text><path class="flow" d="M590 501 H750"/>
  <rect class="prod" x="230" y="615" width="940" height="100" rx="16"/><text class="text label" x="700" y="650" text-anchor="middle">AWS production HA</text><text class="muted small" x="700" y="678" text-anchor="middle">multi-AZ ALB + ASGs · ECR + Packer · WAF · secrets · observability · controlled promotion</text><text class="muted small" x="700" y="698" text-anchor="middle">private app tier → internal load balancer → private GPU inference tier</text>
  <path class="flow" d="M940 542 V605"/>
  <text class="muted small" x="40" y="742">Capabilities accumulate: Python → Docker → Terraform/AWS → cloud-init → Ansible → service separation → private inference → high availability.</text>
</svg>
