<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Streamlit and Ollama AWS microservices architecture</title>
  <desc id="desc">A browser reaches Streamlit on a public T-family instance. Streamlit alone reaches Ollama on a private GPU instance. A NAT gateway provides outbound-only internet access to Ollama.</desc>
  <defs>
    <style>
      .bg{fill:#f8fafc}.vpc{fill:#eef6ff;stroke:#2563eb;stroke-width:2}.public{fill:#fff7ed;stroke:#ea580c;stroke-width:2}.private{fill:#ecfdf5;stroke:#059669;stroke-width:2}.box{fill:#fff;stroke:#334155;stroke-width:2}.title{font:700 24px system-ui,sans-serif;fill:#0f172a}.label{font:600 17px system-ui,sans-serif;fill:#0f172a}.small{font:14px system-ui,sans-serif;fill:#334155}.arrow{stroke:#334155;stroke-width:2.5;fill:none;marker-end:url(#head)}
    </style>
    <marker id="head" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#334155"/></marker>
  </defs>
  <rect class="bg" width="1200" height="650"/>
  <text class="title" x="40" y="45">Local AI Assistant — separated AWS microservices</text>
  <rect class="box" x="35" y="245" width="160" height="85" rx="12"/>
  <text class="label" x="78" y="280">Browser</text><text class="small" x="57" y="307">HTTP :8501</text>
  <rect class="vpc" x="245" y="80" width="915" height="500" rx="18"/>
  <text class="title" x="275" y="120">AWS ap-south-1 · new VPC</text>
  <rect class="public" x="285" y="155" width="360" height="360" rx="16"/>
  <text class="label" x="395" y="190">Public subnet</text>
  <rect class="box" x="325" y="225" width="280" height="125" rx="12"/>
  <text class="label" x="360" y="260">Streamlit · t3/t3a/t4g</text>
  <text class="small" x="355" y="288">native or Docker · port 8501</text>
  <text class="small" x="355" y="313">public IP · SSM managed</text>
  <rect class="box" x="325" y="395" width="280" height="80" rx="12"/>
  <text class="label" x="405" y="428">NAT gateway</text>
  <text class="small" x="370" y="454">outbound path for private tier</text>
  <rect class="private" x="700" y="155" width="410" height="360" rx="16"/>
  <text class="label" x="840" y="190">Private subnet</text>
  <rect class="box" x="745" y="225" width="320" height="125" rx="12"/>
  <text class="label" x="790" y="260">Ollama · g4dn.xlarge</text>
  <text class="small" x="785" y="288">NVIDIA T4 · private port 11434</text>
  <text class="small" x="785" y="313">no public IP · SSM managed</text>
  <rect class="box" x="745" y="395" width="320" height="80" rx="12"/>
  <text class="label" x="830" y="428">Encrypted gp3</text>
  <text class="small" x="813" y="454">Ollama models and root disk</text>
  <path class="arrow" d="M195 288H325"/><text class="small" x="205" y="273">trusted CIDR</text>
  <path class="arrow" d="M605 288H745"/><text class="small" x="620" y="273">private :11434</text>
  <path class="arrow" d="M745 435H605"/>
  <text class="small" x="58" y="615">Ollama accepts traffic only from the Streamlit security group. The private GPU instance has no public IP.</text>
</svg>
