<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Production high-availability Local AI Assistant architecture</title>
  <desc id="desc">Internet traffic enters a public application load balancer, reaches Nginx and Streamlit instances in two private application subnets, then reaches Ollama GPU instances through an internal load balancer in two private GPU subnets.</desc>
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .vpc { fill: #161b22; stroke: #58a6ff; stroke-width: 3; }
      .zone { fill: #0d1117; stroke: #30363d; stroke-width: 2; stroke-dasharray: 8 6; }
      .public { fill: #17253a; stroke: #58a6ff; stroke-width: 2; }
      .app { fill: #173425; stroke: #3fb950; stroke-width: 2; }
      .gpu { fill: #38251a; stroke: #d29922; stroke-width: 2; }
      .managed { fill: #2b1d3d; stroke: #bc8cff; stroke-width: 2; }
      .text { fill: #f0f6fc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .muted { fill: #8b949e; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .title { font-size: 27px; font-weight: 700; }
      .label { font-size: 18px; font-weight: 650; }
      .small { font-size: 14px; }
      .flow { fill: none; stroke: #f0f6fc; stroke-width: 3; marker-end: url(#arrow); }
      .config { fill: none; stroke: #bc8cff; stroke-width: 2; stroke-dasharray: 7 5; marker-end: url(#purpleArrow); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#f0f6fc"/>
    </marker>
    <marker id="purpleArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#bc8cff"/>
    </marker>
  </defs>

  <rect class="bg" width="1400" height="820"/>
  <text class="text title" x="40" y="48">Local AI Assistant — Production HA (ap-south-1)</text>

  <rect class="managed" x="40" y="82" width="210" height="76" rx="12"/>
  <text class="text label" x="145" y="113" text-anchor="middle">Clients</text>
  <text class="muted small" x="145" y="137" text-anchor="middle">HTTP :80 / HTTPS :443</text>

  <rect class="vpc" x="285" y="82" width="1075" height="610" rx="18"/>
  <text class="text label" x="310" y="115">Dedicated VPC</text>

  <rect class="public" x="465" y="130" width="680" height="86" rx="12"/>
  <text class="text label" x="805" y="163" text-anchor="middle">Public Application Load Balancer</text>
  <text class="muted small" x="805" y="188" text-anchor="middle">AWS WAF · two public subnets · ACM TLS + HTTP redirect</text>

  <rect class="zone" x="320" y="250" width="490" height="405" rx="14"/>
  <text class="muted label" x="345" y="284">Availability Zone A</text>
  <rect class="zone" x="835" y="250" width="490" height="405" rx="14"/>
  <text class="muted label" x="860" y="284">Availability Zone B</text>

  <rect class="app" x="360" y="315" width="410" height="110" rx="12"/>
  <text class="text label" x="565" y="348" text-anchor="middle">Private app instance</text>
  <text class="muted small" x="565" y="375" text-anchor="middle">Nginx :80 → Streamlit container :8501</text>
  <text class="muted small" x="565" y="398" text-anchor="middle">ECR digest · SSM config · CloudWatch Agent</text>

  <rect class="app" x="875" y="315" width="410" height="110" rx="12"/>
  <text class="text label" x="1080" y="348" text-anchor="middle">Private app instance</text>
  <text class="muted small" x="1080" y="375" text-anchor="middle">Nginx :80 → Streamlit container :8501</text>
  <text class="muted small" x="1080" y="398" text-anchor="middle">Application Auto Scaling Group</text>

  <rect class="managed" x="555" y="460" width="500" height="75" rx="12"/>
  <text class="text label" x="805" y="490" text-anchor="middle">Internal Ollama Load Balancer :11434</text>
  <text class="muted small" x="805" y="514" text-anchor="middle">Reachable only from the application security group</text>

  <rect class="gpu" x="360" y="565" width="410" height="70" rx="12"/>
  <text class="text label" x="565" y="594" text-anchor="middle">Private g4dn.xlarge</text>
  <text class="muted small" x="565" y="617" text-anchor="middle">Ollama · verified EBS model cache</text>

  <rect class="gpu" x="875" y="565" width="410" height="70" rx="12"/>
  <text class="text label" x="1080" y="594" text-anchor="middle">Private g4dn.xlarge</text>
  <text class="muted small" x="1080" y="617" text-anchor="middle">GPU Auto Scaling Group</text>

  <path class="flow" d="M250 120 H455"/>
  <path class="flow" d="M680 216 L565 305"/>
  <path class="flow" d="M930 216 L1080 305"/>
  <path class="flow" d="M565 425 L700 455"/>
  <path class="flow" d="M1080 425 L910 455"/>
  <path class="flow" d="M700 535 L565 555"/>
  <path class="flow" d="M910 535 L1080 555"/>

  <rect class="managed" x="70" y="240" width="195" height="88" rx="12"/>
  <text class="text label" x="168" y="272" text-anchor="middle">ECR</text>
  <text class="muted small" x="168" y="297" text-anchor="middle">Immutable image digest</text>
  <text class="muted small" x="168" y="317" text-anchor="middle">Scanning + lifecycle</text>

  <rect class="managed" x="70" y="355" width="195" height="88" rx="12"/>
  <text class="text label" x="168" y="387" text-anchor="middle">SSM + Secrets</text>
  <text class="muted small" x="168" y="412" text-anchor="middle">Managed configuration</text>
  <text class="muted small" x="168" y="432" text-anchor="middle">IAM-scoped retrieval</text>

  <rect class="managed" x="70" y="470" width="195" height="88" rx="12"/>
  <text class="text label" x="168" y="502" text-anchor="middle">CloudWatch + X-Ray</text>
  <text class="muted small" x="168" y="527" text-anchor="middle">Logs · metrics · alarms</text>
  <text class="muted small" x="168" y="547" text-anchor="middle">Dashboard · traces</text>

  <path class="config" d="M265 284 H350"/>
  <path class="config" d="M265 399 H350"/>
  <path class="config" d="M265 514 H350"/>

  <rect class="managed" x="285" y="720" width="1075" height="68" rx="12"/>
  <text class="text label" x="823" y="749" text-anchor="middle">Delivery and state</text>
  <text class="muted small" x="823" y="773" text-anchor="middle">GitHub OIDC (optional) · Packer + Ansible AMIs · versioned S3 state · S3-native locking · KMS</text>
</svg>
