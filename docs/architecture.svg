<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Local Docker runtime, host networking, and request sequence</title>
  <desc id="desc">Streamlit runs as a non-root Docker container and calls host-native Ollama through Linux host networking or Docker Desktop host.docker.internal.</desc>
  <defs><style>
    .bg{fill:#0d1117}.host{fill:#161b22;stroke:#58a6ff;stroke-width:3}.docker{fill:#17253a;stroke:#58a6ff;stroke-width:2}.native{fill:#38251a;stroke:#d29922;stroke-width:2}.secure{fill:#173425;stroke:#3fb950;stroke-width:2}.panel{fill:#0d1117;stroke:#30363d;stroke-width:2;stroke-dasharray:8 6}.text{fill:#f0f6fc;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.muted{fill:#8b949e;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.title{font-size:28px;font-weight:700}.label{font-size:18px;font-weight:650}.small{font-size:14px}.flow{fill:none;stroke:#f0f6fc;stroke-width:3;marker-end:url(#a)}.return{fill:none;stroke:#3fb950;stroke-width:2;stroke-dasharray:8 6;marker-end:url(#g)}
  </style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#f0f6fc"/></marker><marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#3fb950"/></marker></defs>
  <rect class="bg" width="1200" height="700"/><text class="text title" x="40" y="48">Local Docker — Containerized App / Host-Native Inference</text>
  <rect class="host" x="40" y="82" width="1120" height="565" rx="18"/><text class="text label" x="70" y="116">Local machine</text>
  <rect class="panel" x="70" y="145" width="500" height="455" rx="14"/><text class="text label" x="320" y="178" text-anchor="middle">Runtime boundary</text>
  <rect class="docker" x="110" y="210" width="420" height="175" rx="14"/><text class="text label" x="320" y="245" text-anchor="middle">Docker Engine</text>
  <rect class="secure" x="145" y="270" width="350" height="82" rx="12"/><text class="text label" x="320" y="301" text-anchor="middle">Streamlit container · :8501</text><text class="muted small" x="320" y="328" text-anchor="middle">app.py · dependencies · non-root user</text>
  <rect class="native" x="110" y="455" width="200" height="90" rx="12"/><text class="text label" x="210" y="489" text-anchor="middle">Ollama</text><text class="muted small" x="210" y="516" text-anchor="middle">host service :11434</text>
  <rect class="native" x="330" y="455" width="200" height="90" rx="12"/><text class="text label" x="430" y="489" text-anchor="middle">Model cache</text><text class="muted small" x="430" y="516" text-anchor="middle">host storage</text>
  <path class="flow" d="M320 385 L225 445"/><path class="flow" d="M310 500 H320"/>
  <rect class="panel" x="610" y="145" width="510" height="205" rx="14"/><text class="text label" x="865" y="178" text-anchor="middle">Container → host networking</text>
  <rect class="docker" x="650" y="215" width="160" height="75" rx="12"/><text class="text label" x="730" y="248" text-anchor="middle">Linux</text><text class="muted small" x="730" y="272" text-anchor="middle">--network host</text>
  <rect class="docker" x="920" y="215" width="160" height="75" rx="12"/><text class="text label" x="1000" y="248" text-anchor="middle">Desktop</text><text class="muted small" x="1000" y="272" text-anchor="middle">host.docker.internal</text>
  <path class="flow" d="M810 253 H910"/>
  <rect class="panel" x="610" y="380" width="510" height="220" rx="14"/><text class="text label" x="865" y="413" text-anchor="middle">Request sequence</text>
  <text class="muted small" x="650" y="455">1 · Browser → Streamlit container :8501</text><path class="flow" d="M650 470 H1060"/>
  <text class="muted small" x="650" y="510">2 · Container → host Ollama :11434</text><path class="flow" d="M650 525 H1060"/>
  <text class="muted small" x="650" y="565">3 · Streamed model chunks return to browser</text><path class="return" d="M1060 580 H650"/>
</svg>
