<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Local native runtime architecture and request sequence</title>
  <desc id="desc">A browser calls native Streamlit, which calls native Ollama and a local model on the same machine. A second panel shows the request and streamed response sequence.</desc>
  <defs>
    <style>
      .bg{fill:#0d1117}.boundary{fill:#161b22;stroke:#58a6ff;stroke-width:3}.box{fill:#17253a;stroke:#58a6ff;stroke-width:2}.model{fill:#38251a;stroke:#d29922;stroke-width:2}.env{fill:#173425;stroke:#3fb950;stroke-width:2}.text{fill:#f0f6fc;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.muted{fill:#8b949e;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.title{font-size:28px;font-weight:700}.label{font-size:18px;font-weight:650}.small{font-size:14px}.flow{fill:none;stroke:#f0f6fc;stroke-width:3;marker-end:url(#arrow)}.return{fill:none;stroke:#3fb950;stroke-width:2;stroke-dasharray:8 6;marker-end:url(#greenArrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#f0f6fc"/></marker>
    <marker id="greenArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#3fb950"/></marker>
  </defs>
  <rect class="bg" width="1200" height="650"/>
  <text class="text title" x="40" y="48">Local Native — Runtime and Request Flow</text>
  <rect class="boundary" x="40" y="82" width="1120" height="520" rx="18"/>
  <text class="text label" x="70" y="116">Local machine</text>
  <rect class="env" x="75" y="145" width="500" height="405" rx="14"/>
  <text class="text label" x="325" y="178" text-anchor="middle">Native runtime</text>
  <rect class="box" x="120" y="215" width="410" height="72" rx="12"/>
  <text class="text label" x="325" y="247" text-anchor="middle">Browser</text>
  <text class="muted small" x="325" y="270" text-anchor="middle">HTTP localhost:8501</text>
  <rect class="box" x="120" y="325" width="410" height="82" rx="12"/>
  <text class="text label" x="325" y="357" text-anchor="middle">Streamlit · app.py</text>
  <text class="muted small" x="325" y="382" text-anchor="middle">Python .venv · ollama_client.py</text>
  <rect class="box" x="120" y="445" width="190" height="72" rx="12"/>
  <text class="text label" x="215" y="477" text-anchor="middle">Ollama</text>
  <text class="muted small" x="215" y="500" text-anchor="middle">localhost:11434</text>
  <rect class="model" x="340" y="445" width="190" height="72" rx="12"/>
  <text class="text label" x="435" y="477" text-anchor="middle">Local model</text>
  <text class="muted small" x="435" y="500" text-anchor="middle">llama3.2:3b</text>
  <path class="flow" d="M325 287 V315"/><path class="flow" d="M270 407 L225 438"/><path class="flow" d="M310 481 H330"/>
  <rect class="box" x="625" y="145" width="500" height="405" rx="14"/>
  <text class="text label" x="875" y="178" text-anchor="middle">Request sequence</text>
  <text class="muted small" x="675" y="220">1 · Browser submits a prompt</text>
  <path class="flow" d="M675 240 H1060"/>
  <text class="muted small" x="675" y="285">2 · Streamlit sends chat history to Ollama</text>
  <path class="flow" d="M675 305 H1060"/>
  <text class="muted small" x="675" y="350">3 · Ollama runs GPU/CPU inference locally</text>
  <path class="flow" d="M675 370 H1060"/>
  <text class="muted small" x="675" y="415">4 · Generated chunks stream back</text>
  <path class="return" d="M1060 435 H675"/>
  <text class="muted small" x="675" y="485">5 · Streamlit updates the active chat session</text>
  <path class="return" d="M1060 505 H675"/>
</svg>
