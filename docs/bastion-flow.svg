<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Ansible bastion deployment and two-tier service flow</title><desc id="desc">Ansible connects to the public Streamlit host and uses it as ProxyJump to configure private Ollama. Runtime traffic follows the same public-to-private tier direction with separate security groups.</desc>
  <defs><style>.bg{fill:#0d1117}.control{fill:#2b1d3d;stroke:#bc8cff;stroke-width:2}.public{fill:#17253a;stroke:#58a6ff;stroke-width:2}.private{fill:#38251a;stroke:#d29922;stroke-width:2}.runtime{fill:#173425;stroke:#3fb950;stroke-width:2}.text{fill:#f0f6fc;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.muted{fill:#8b949e;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.title{font-size:27px;font-weight:700}.label{font-size:17px;font-weight:650}.small{font-size:13px}.ssh{fill:none;stroke:#bc8cff;stroke-width:3;stroke-dasharray:8 6;marker-end:url(#p)}.flow{fill:none;stroke:#3fb950;stroke-width:3;marker-end:url(#g)}</style><marker id="p" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#bc8cff"/></marker><marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#3fb950"/></marker></defs>
  <rect class="bg" width="1200" height="430"/><text class="text title" x="40" y="48">Ansible Control Path and Runtime Trust Boundary</text>
  <rect class="control" x="40" y="115" width="220" height="150" rx="14"/><text class="text label" x="150" y="153" text-anchor="middle">Ansible control node</text><text class="muted small" x="150" y="184" text-anchor="middle">generated inventory</text><text class="muted small" x="150" y="207" text-anchor="middle">verified host keys</text><text class="muted small" x="150" y="230" text-anchor="middle">CIDR-restricted SSH</text>
  <rect class="public" x="355" y="82" width="310" height="215" rx="14"/><text class="text label" x="510" y="122" text-anchor="middle">Public app instance</text><text class="muted small" x="400" y="157">T-family EC2 · public IP</text><text class="muted small" x="400" y="181">Native Streamlit :8501</text><text class="muted small" x="400" y="205">SSH bastion / ProxyJump</text><text class="muted small" x="400" y="229">App security group</text><text class="muted small" x="400" y="253">SSM + encrypted EBS</text>
  <rect class="private" x="760" y="82" width="400" height="215" rx="14"/><text class="text label" x="960" y="122" text-anchor="middle">Private GPU inference instance</text><text class="muted small" x="810" y="157">g4dn.xlarge · no public IP</text><text class="muted small" x="810" y="181">Native Ollama :11434</text><text class="muted small" x="810" y="205">NVIDIA T4 + local models</text><text class="muted small" x="810" y="229">Ollama SG trusts only App SG</text><text class="muted small" x="810" y="253">Outbound package/model access via NAT</text>
  <path class="ssh" d="M260 165 H345"/><text class="muted small" x="280" y="151">SSH</text><path class="ssh" d="M665 165 H750"/><text class="muted small" x="678" y="151">ProxyJump</text>
  <path class="flow" d="M665 245 H750"/><text class="muted small" x="682" y="232">HTTP :11434</text>
  <text class="muted small" x="40" y="360">Management and application traffic share direction, but use distinct controls: SSH ProxyJump vs security-group-referenced service access.</text>
</svg>
