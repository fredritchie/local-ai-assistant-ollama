<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Terraform infrastructure and native cloud-init bootstrap flow</title>
  <desc id="desc">Terraform creates AWS infrastructure, EC2 launches, and cloud-init installs Ollama, models, Python, and native systemd services before reporting health.</desc>
  <defs><style>.bg{fill:#0d1117}.iac{fill:#2b1d3d;stroke:#bc8cff;stroke-width:2}.aws{fill:#17253a;stroke:#58a6ff;stroke-width:2}.boot{fill:#38251a;stroke:#d29922;stroke-width:2}.ready{fill:#173425;stroke:#3fb950;stroke-width:2}.text{fill:#f0f6fc;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.muted{fill:#8b949e;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.title{font-size:27px;font-weight:700}.label{font-size:17px;font-weight:650}.small{font-size:13px}.flow{fill:none;stroke:#f0f6fc;stroke-width:3;marker-end:url(#a)}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#f0f6fc"/></marker></defs>
  <rect class="bg" width="1200" height="360"/><text class="text title" x="40" y="48">Provisioning vs Native Server Bootstrap</text>
  <rect class="iac" x="40" y="105" width="190" height="135" rx="14"/><text class="text label" x="135" y="142" text-anchor="middle">Terraform apply</text><text class="muted small" x="135" y="173" text-anchor="middle">VPC · subnet · SG</text><text class="muted small" x="135" y="195" text-anchor="middle">IAM · EBS · EC2</text>
  <rect class="aws" x="285" y="105" width="170" height="135" rx="14"/><text class="text label" x="370" y="153" text-anchor="middle">EC2 launch</text><text class="muted small" x="370" y="184" text-anchor="middle">CUDA DLAMI</text><text class="muted small" x="370" y="206" text-anchor="middle">g4dn.xlarge</text>
  <rect class="boot" x="510" y="82" width="400" height="180" rx="14"/><text class="text label" x="710" y="120" text-anchor="middle">cloud-init / user data</text><text class="muted small" x="550" y="153">1 · Install packages and pinned Ollama</text><text class="muted small" x="550" y="178">2 · Pull and verify configured models</text><text class="muted small" x="550" y="203">3 · Clone branch and create Python .venv</text><text class="muted small" x="550" y="228">4 · Create native systemd services</text>
  <rect class="ready" x="965" y="105" width="195" height="135" rx="14"/><text class="text label" x="1062" y="142" text-anchor="middle">Health gate</text><text class="muted small" x="1062" y="174" text-anchor="middle">Streamlit healthy</text><text class="muted small" x="1062" y="196" text-anchor="middle">completion marker</text><text class="muted small" x="1062" y="218" text-anchor="middle">failure marker on error</text>
  <path class="flow" d="M230 172 H275"/><path class="flow" d="M455 172 H500"/><path class="flow" d="M910 172 H955"/>
  <text class="muted small" x="40" y="315">Terraform owns infrastructure state. cloud-init owns first-boot native service installation and reports readiness.</text>
</svg>
