<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">Terraform, cloud-init, and Docker deployment flow</title><desc id="desc">Terraform provisions AWS, cloud-init installs the host, native Ollama starts, and Docker builds and runs Streamlit before health verification.</desc>
  <defs><style>.bg{fill:#0d1117}.iac{fill:#2b1d3d;stroke:#bc8cff;stroke-width:2}.aws{fill:#17253a;stroke:#58a6ff;stroke-width:2}.host{fill:#38251a;stroke:#d29922;stroke-width:2}.docker{fill:#173425;stroke:#3fb950;stroke-width:2}.text{fill:#f0f6fc;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.muted{fill:#8b949e;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.title{font-size:27px;font-weight:700}.label{font-size:17px;font-weight:650}.small{font-size:13px}.flow{fill:none;stroke:#f0f6fc;stroke-width:3;marker-end:url(#a)}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#f0f6fc"/></marker></defs>
  <rect class="bg" width="1200" height="390"/><text class="text title" x="40" y="48">User Data Docker — Provisioning and Runtime Transition</text>
  <rect class="iac" x="35" y="115" width="185" height="130" rx="14"/><text class="text label" x="127" y="153" text-anchor="middle">Terraform</text><text class="muted small" x="127" y="182" text-anchor="middle">VPC · SG · IAM</text><text class="muted small" x="127" y="204" text-anchor="middle">EBS · GPU EC2</text>
  <rect class="aws" x="265" y="115" width="170" height="130" rx="14"/><text class="text label" x="350" y="164" text-anchor="middle">EC2 launch</text><text class="muted small" x="350" y="193" text-anchor="middle">CUDA DLAMI</text><text class="muted small" x="350" y="215" text-anchor="middle">cloud-init starts</text>
  <rect class="host" x="480" y="85" width="265" height="190" rx="14"/><text class="text label" x="612" y="124" text-anchor="middle">Host bootstrap</text><text class="muted small" x="515" y="157">Install Docker + Ollama</text><text class="muted small" x="515" y="182">Pull models</text><text class="muted small" x="515" y="207">Ollama native systemd</text><text class="muted small" x="515" y="232">Clone pinned revision</text>
  <rect class="docker" x="790" y="85" width="240" height="190" rx="14"/><text class="text label" x="910" y="124" text-anchor="middle">Docker delivery</text><text class="muted small" x="825" y="157">Build application image</text><text class="muted small" x="825" y="182">Run non-root Streamlit</text><text class="muted small" x="825" y="207">systemd owns container</text><text class="muted small" x="825" y="232">Expose :8501</text>
  <rect class="docker" x="1075" y="115" width="90" height="130" rx="14"/><text class="text label" x="1120" y="165" text-anchor="middle">Ready</text><text class="muted small" x="1120" y="193" text-anchor="middle">health</text><text class="muted small" x="1120" y="215" text-anchor="middle">marker</text>
  <path class="flow" d="M220 180 H255"/><path class="flow" d="M435 180 H470"/><path class="flow" d="M745 180 H780"/><path class="flow" d="M1030 180 H1065"/>
  <text class="muted small" x="40" y="340">Ollama remains native for GPU inference; only Streamlit crosses the new container boundary.</text>
</svg>
