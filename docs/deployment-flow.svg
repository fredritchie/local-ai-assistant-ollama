<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">Terraform to Ansible to Docker deployment architecture</title><desc id="desc">A developer runs Terraform, creates trusted inventory, applies Ansible, and runs Docker Streamlit beside native Ollama and the NVIDIA GPU.</desc>
  <defs><style>.bg{fill:#0d1117}.control{fill:#2b1d3d;stroke:#bc8cff;stroke-width:2}.iac{fill:#17253a;stroke:#58a6ff;stroke-width:2}.config{fill:#38251a;stroke:#d29922;stroke-width:2}.runtime{fill:#173425;stroke:#3fb950;stroke-width:2}.text{fill:#f0f6fc;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.muted{fill:#8b949e;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.title{font-size:27px;font-weight:700}.label{font-size:16px;font-weight:650}.small{font-size:13px}.flow{fill:none;stroke:#f0f6fc;stroke-width:3;marker-end:url(#a)}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#f0f6fc"/></marker></defs>
  <rect class="bg" width="1200" height="390"/><text class="text title" x="40" y="48">IaC → Configuration Management → Containerization → Application</text>
  <rect class="control" x="30" y="115" width="175" height="135" rx="14"/><text class="text label" x="117" y="152" text-anchor="middle">Developer</text><text class="muted small" x="117" y="182" text-anchor="middle">deploy helper</text><text class="muted small" x="117" y="205" text-anchor="middle">reviewed inputs</text>
  <rect class="iac" x="250" y="90" width="200" height="185" rx="14"/><text class="text label" x="350" y="127" text-anchor="middle">Terraform</text><text class="muted small" x="290" y="160">VPC · SG · IAM</text><text class="muted small" x="290" y="184">EBS · GPU EC2</text><text class="muted small" x="290" y="208">outputs → inventory</text><text class="muted small" x="290" y="232">trusted host key</text>
  <rect class="config" x="495" y="90" width="200" height="185" rx="14"/><text class="text label" x="595" y="127" text-anchor="middle">Ansible</text><text class="muted small" x="535" y="160">Docker Engine</text><text class="muted small" x="535" y="184">native Ollama</text><text class="muted small" x="535" y="208">model downloads</text><text class="muted small" x="535" y="232">systemd units</text>
  <rect class="runtime" x="740" y="90" width="200" height="185" rx="14"/><text class="text label" x="840" y="127" text-anchor="middle">Docker runtime</text><text class="muted small" x="780" y="160">non-root Streamlit</text><text class="muted small" x="780" y="184">container :8501</text><text class="muted small" x="780" y="208">loopback host API</text><text class="muted small" x="780" y="232">health check</text>
  <rect class="runtime" x="985" y="90" width="185" height="185" rx="14"/><text class="text label" x="1077" y="127" text-anchor="middle">Inference</text><text class="muted small" x="1025" y="160">Ollama :11434</text><text class="muted small" x="1025" y="184">NVIDIA T4</text><text class="muted small" x="1025" y="208">local models</text><text class="muted small" x="1025" y="232">streamed tokens</text>
  <path class="flow" d="M205 182 H240"/><path class="flow" d="M450 182 H485"/><path class="flow" d="M695 182 H730"/><path class="flow" d="M940 182 H975"/>
  <text class="muted small" x="40" y="335">The application boundary changes; Ollama remains native and private on loopback for GPU access.</text>
</svg>
