<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Terraform, Ansible, Docker application, and private native inference architecture</title><desc id="desc">Terraform creates public and private tiers. Ansible configures the app host and reaches the private GPU through a bastion. Browser requests enter Docker Streamlit and continue to native private Ollama.</desc>
  <defs><style>.bg{fill:#0d1117}.control{fill:#2b1d3d;stroke:#bc8cff;stroke-width:2}.public{fill:#17253a;stroke:#58a6ff;stroke-width:2}.private{fill:#38251a;stroke:#d29922;stroke-width:2}.runtime{fill:#173425;stroke:#3fb950;stroke-width:2}.lane{fill:#161b22;stroke:#30363d;stroke-width:2;stroke-dasharray:8 6}.text{fill:#f0f6fc;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.muted{fill:#8b949e;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.title{font-size:27px;font-weight:700}.label{font-size:17px;font-weight:650}.small{font-size:13px}.deploy{fill:none;stroke:#bc8cff;stroke-width:3;stroke-dasharray:8 6;marker-end:url(#p)}.flow{fill:none;stroke:#3fb950;stroke-width:3;marker-end:url(#g)}</style><marker id="p" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#bc8cff"/></marker><marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#3fb950"/></marker></defs>
  <rect class="bg" width="1200" height="560"/><text class="text title" x="40" y="48">Two-Tier Docker Microservices — Deployment and Request Paths</text>
  <rect class="lane" x="40" y="82" width="1120" height="190" rx="14"/><text class="text label" x="65" y="115">Management / deployment</text>
  <rect class="control" x="80" y="145" width="190" height="90" rx="12"/><text class="text label" x="175" y="179" text-anchor="middle">Developer</text><text class="muted small" x="175" y="206" text-anchor="middle">Terraform + Ansible</text>
  <rect class="public" x="390" y="135" width="280" height="110" rx="12"/><text class="text label" x="530" y="170" text-anchor="middle">Public app EC2</text><text class="muted small" x="530" y="198" text-anchor="middle">inventory target + SSH bastion</text><text class="muted small" x="530" y="221" text-anchor="middle">Docker host configuration</text>
  <rect class="private" x="790" y="135" width="300" height="110" rx="12"/><text class="text label" x="940" y="170" text-anchor="middle">Private GPU EC2</text><text class="muted small" x="940" y="198" text-anchor="middle">ProxyJump configuration target</text><text class="muted small" x="940" y="221" text-anchor="middle">native Ollama + models</text>
  <path class="deploy" d="M270 190 H380"/><text class="muted small" x="302" y="176">SSH</text><path class="deploy" d="M670 190 H780"/><text class="muted small" x="693" y="176">ProxyJump</text>
  <rect class="lane" x="40" y="305" width="1120" height="205" rx="14"/><text class="text label" x="65" y="338">Runtime request sequence</text>
  <rect class="runtime" x="80" y="375" width="170" height="90" rx="12"/><text class="text label" x="165" y="410" text-anchor="middle">Browser</text><text class="muted small" x="165" y="437" text-anchor="middle">TCP :8501</text>
  <rect class="public" x="345" y="365" width="280" height="110" rx="12"/><text class="text label" x="485" y="400" text-anchor="middle">Docker Streamlit</text><text class="muted small" x="485" y="428" text-anchor="middle">non-root container :8501</text><text class="muted small" x="485" y="451" text-anchor="middle">public app security group</text>
  <rect class="private" x="735" y="365" width="370" height="110" rx="12"/><text class="text label" x="920" y="400" text-anchor="middle">Native Ollama GPU service</text><text class="muted small" x="920" y="428" text-anchor="middle">private :11434 · NVIDIA T4</text><text class="muted small" x="920" y="451" text-anchor="middle">SG accepts only App SG</text>
  <path class="flow" d="M250 420 H335"/><path class="flow" d="M625 420 H725"/><text class="muted small" x="650" y="406">HTTP :11434</text>
</svg>
