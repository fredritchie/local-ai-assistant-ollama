<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Terraform and Ansible responsibility flow for native services</title><desc id="desc">A control machine invokes Terraform to create AWS resources, generates a trusted inventory, then Ansible configures native Streamlit and Ollama on the GPU host.</desc>
  <defs><style>.bg{fill:#0d1117}.control{fill:#2b1d3d;stroke:#bc8cff;stroke-width:2}.iac{fill:#17253a;stroke:#58a6ff;stroke-width:2}.config{fill:#38251a;stroke:#d29922;stroke-width:2}.host{fill:#173425;stroke:#3fb950;stroke-width:2}.text{fill:#f0f6fc;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.muted{fill:#8b949e;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.title{font-size:27px;font-weight:700}.label{font-size:17px;font-weight:650}.small{font-size:13px}.flow{fill:none;stroke:#f0f6fc;stroke-width:3;marker-end:url(#a)}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#f0f6fc"/></marker></defs>
  <rect class="bg" width="1200" height="430"/><text class="text title" x="40" y="48">Terraform Provisions · Ansible Configures · Native Services Run</text>
  <rect class="control" x="40" y="105" width="190" height="170" rx="14"/><text class="text label" x="135" y="143" text-anchor="middle">Control machine</text><text class="muted small" x="135" y="177" text-anchor="middle">deploy helper</text><text class="muted small" x="135" y="201" text-anchor="middle">SSH key + CIDR</text><text class="muted small" x="135" y="225" text-anchor="middle">known-host check</text>
  <rect class="iac" x="280" y="82" width="255" height="215" rx="14"/><text class="text label" x="407" y="122" text-anchor="middle">Terraform state</text><text class="muted small" x="320" y="157">VPC + public subnet</text><text class="muted small" x="320" y="181">SG + IAM + SSM</text><text class="muted small" x="320" y="205">Encrypted EBS</text><text class="muted small" x="320" y="229">g4dn.xlarge EC2</text><text class="muted small" x="320" y="253">Outputs → inventory</text>
  <rect class="config" x="585" y="82" width="255" height="215" rx="14"/><text class="text label" x="712" y="122" text-anchor="middle">Ansible role</text><text class="muted small" x="625" y="157">Packages + Ollama</text><text class="muted small" x="625" y="181">Pinned models</text><text class="muted small" x="625" y="205">Repository + .venv</text><text class="muted small" x="625" y="229">Native systemd units</text><text class="muted small" x="625" y="253">Health verification</text>
  <rect class="host" x="890" y="82" width="270" height="215" rx="14"/><text class="text label" x="1025" y="122" text-anchor="middle">GPU host runtime</text><text class="muted small" x="930" y="163">Streamlit systemd :8501</text><text class="muted small" x="930" y="191">↓ loopback request</text><text class="muted small" x="930" y="219">Ollama :11434</text><text class="muted small" x="930" y="247">↓ NVIDIA T4 + models</text>
  <path class="flow" d="M230 190 H270"/><path class="flow" d="M535 190 H575"/><path class="flow" d="M840 190 H880"/>
  <text class="muted small" x="40" y="365">Boundary: Terraform does not configure the application; Ansible does not create the VPC or EC2 instance.</text>
</svg>
