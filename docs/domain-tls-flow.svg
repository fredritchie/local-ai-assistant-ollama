<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">DuckDNS and Let's Encrypt HTTPS delivery architecture</title><desc id="desc">Clients resolve DuckDNS to a stable Global Accelerator IP and reach the public ALB. For initial certificate issuance, a protected GitHub environment secret supplies the DuckDNS token. The workflow stores it in Secrets Manager for renewal, manages the DNS-01 challenge with Certbot, exchanges ACME messages with Let's Encrypt, and imports or reimports the resulting certificate into ACM.</desc>
  <defs><style>.bg{fill:#0d1117}.dns{fill:#2b1d3d;stroke:#bc8cff;stroke-width:2}.edge{fill:#17253a;stroke:#58a6ff;stroke-width:2}.tls{fill:#38251a;stroke:#d29922;stroke-width:2}.app{fill:#173425;stroke:#3fb950;stroke-width:2}.lane{fill:#161b22;stroke:#30363d;stroke-width:2;stroke-dasharray:8 6}.text{fill:#f0f6fc;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.muted{fill:#8b949e;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.title{font-size:27px;font-weight:700}.label{font-size:16px;font-weight:650}.small{font-size:12px}.flow{fill:none;stroke:#f0f6fc;stroke-width:3;marker-end:url(#a)}.cert{fill:none;stroke:#d29922;stroke-width:3;stroke-dasharray:8 6;marker-end:url(#o)}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#f0f6fc"/></marker><marker id="o" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#d29922"/></marker></defs>
  <rect class="bg" width="1200" height="620"/><text class="text title" x="40" y="48">DuckDNS + Global Accelerator + Let's Encrypt at the ALB</text>
  <rect class="lane" x="40" y="82" width="1120" height="175" rx="14"/><text class="text label" x="65" y="114">HTTPS request path</text>
  <rect class="app" x="70" y="145" width="145" height="75" rx="12"/><text class="text label" x="142" y="177" text-anchor="middle">Client</text><text class="muted small" x="142" y="200" text-anchor="middle">HTTPS :443</text>
  <rect class="dns" x="270" y="135" width="225" height="95" rx="12"/><text class="text label" x="382" y="169" text-anchor="middle">DuckDNS</text><text class="muted small" x="382" y="194" text-anchor="middle">stable A record</text><text class="muted small" x="382" y="215" text-anchor="middle">one accelerator IPv4</text>
  <rect class="edge" x="550" y="135" width="245" height="95" rx="12"/><text class="text label" x="672" y="169" text-anchor="middle">Global Accelerator</text><text class="muted small" x="672" y="194" text-anchor="middle">two static anycast IPs</text><text class="muted small" x="672" y="215" text-anchor="middle">ALB health routing</text>
  <rect class="edge" x="850" y="135" width="270" height="95" rx="12"/><text class="text label" x="985" y="169" text-anchor="middle">Public ALB + WAF</text><text class="muted small" x="985" y="194" text-anchor="middle">ACM certificate · TLS :443</text><text class="muted small" x="985" y="215" text-anchor="middle">HTTP :80 → HTTPS redirect</text>
  <path class="flow" d="M215 182 H260"/><path class="flow" d="M495 182 H540"/><path class="flow" d="M795 182 H840"/>
  <rect class="lane" x="40" y="290" width="1120" height="285" rx="14"/><text class="text label" x="65" y="322">Certificate issuance and renewal</text>

  <rect class="tls" x="70" y="345" width="210" height="75" rx="12"/><text class="text label" x="175" y="376" text-anchor="middle">GitHub environment</text><text class="muted small" x="175" y="401" text-anchor="middle">initial DuckDNS token</text>
  <rect class="tls" x="70" y="475" width="210" height="75" rx="12"/><text class="text label" x="175" y="506" text-anchor="middle">Secrets Manager</text><text class="muted small" x="175" y="531" text-anchor="middle">renewal token store</text>

  <rect class="tls" x="350" y="400" width="230" height="100" rx="12"/><text class="text label" x="465" y="430" text-anchor="middle">Protected workflow</text><text class="muted small" x="465" y="454" text-anchor="middle">Certbot + AWS CLI</text><text class="muted small" x="465" y="477" text-anchor="middle">initial + monthly/manual</text>

  <rect class="dns" x="650" y="340" width="190" height="82" rx="12"/><text class="text label" x="745" y="372" text-anchor="middle">DuckDNS TXT</text><text class="muted small" x="745" y="397" text-anchor="middle">DNS-01 challenge</text>
  <rect class="tls" x="650" y="478" width="190" height="82" rx="12"/><text class="text label" x="745" y="510" text-anchor="middle">Let's Encrypt</text><text class="muted small" x="745" y="535" text-anchor="middle">ACME · ECDSA cert</text>
  <rect class="edge" x="930" y="410" width="170" height="82" rx="12"/><text class="text label" x="1015" y="442" text-anchor="middle">ACM</text><text class="muted small" x="1015" y="467" text-anchor="middle">import / reimport</text>

  <path class="cert" d="M280 382 L340 425"/><text class="muted small" x="294" y="386">initial</text>
  <path class="cert" d="M280 512 L340 475"/><text class="muted small" x="292" y="515">renew</text>
  <path class="cert" d="M350 490 C325 545 305 545 282 520"/><text class="muted small" x="302" y="557">store</text>
  <path class="cert" d="M580 425 L640 390"/><text class="muted small" x="585" y="395">set TXT</text>
  <path class="cert" d="M580 478 L640 510"/><text class="muted small" x="588" y="513">ACME</text>
  <path class="cert" d="M650 535 C610 560 585 535 570 500"/><text class="muted small" x="580" y="555">certificate</text>
  <path class="cert" d="M745 478 V432"/><text class="muted small" x="755" y="458">validate DNS</text>
  <path class="cert" d="M580 450 H920"/><text class="muted small" x="850" y="442">AWS import</text>
</svg>
